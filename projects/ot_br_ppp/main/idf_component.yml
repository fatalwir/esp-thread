## IDF Component Manager Manifest File
##
## Relative to the stock ot_br example this drops:
##   - protocol_examples_common  (example_connect(): Wi-Fi/Ethernet bring-up,
##                                replaced by ppp_modem.c)
##   - ot_examples_br            (calls example_connect() and wires its netif
##                                as the backbone; we do that ourselves)
##   - esp-qa/coexist-cmd        (Wi-Fi/802.15.4 coexistence, not used here --
##                                the radio has the RF path to itself)
dependencies:
  espressif/esp_ot_cli_extension:
    version: "~2.0.0"
  espressif/mdns: "^1.0.3"
  idf:
    version: ">=5.0"
  ot_led:
    path: ${IDF_PATH}/examples/openthread/ot_common_components/ot_led
  ot_examples_common:
    path: ${IDF_PATH}/examples/openthread/ot_common_components/ot_examples_common
